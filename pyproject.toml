[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperphantasia"
version = "0.1.0"
description = "A mental-model reasoning path for AI: imagine, refract, bind, challenge, translate, atone."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=2.14"]
detect = ["jax>=0.4"]
test = ["pytest>=8"]

[project.scripts]
hyperphantasia = "hyperphantasia.__main__:main"

[tool.setuptools.packages.find]
include = ["hyperphantasia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
